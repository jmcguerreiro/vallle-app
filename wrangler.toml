name = "vallle-app"
compatibility_date = "2026-03-17"
# NOTE: pages_build_output_dir intentionally omitted. With it set, wrangler 4's
# `pages dev` infers a static directory and rejects the `-- vite` proxy command
# in the dev script ("directory OR proxy command, not both"). The build output
# dir for deploys is configured in the Cloudflare Pages dashboard (or pass it
# explicitly: `wrangler pages deploy dist`).

[[d1_databases]]
binding = "DB"
database_name = "vallle-db"
database_id = "b4b188fa-1594-433d-adcb-5fe3fbfbf9f7"